<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <main class="main-wrapper">
      <h1>Contact Us</h1>
      <form action="" method="post" novalidate>
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input
            type="text"
            name="first-name"
            id="first-name"
            autocomplete="given-name"
            required
          />
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input
            type="text"
            name="last-name"
            id="last-name"
            autocomplete="family-name"
            required
          />
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group span-all">
          <label for="email">Email</label>
          <input
            type="email"
            data-error="Please enter a valid email address"
            name="email"
            id="email"
            required
          />
          <span class="error-message" aria-live="polite"></span>
        </div>

        <fieldset class="span-all">
          <legend>Query Type</legend>
          <div class="form-group">
            <input
              type="radio"
              name="query"
              id="gen-inquiry"
              value="General Enquiry"
              required
            />
            <label for="gen-inquiry">General Enquiry</label>
          </div>

          <div class="form-group">
            <input
              type="radio"
              name="query"
              id="supp-req"
              value="Support Request"
              required
            />
            <label for="supp-req">Support Request</label>
          </div>

          <span class="error-message" aria-live="polite"></span>
        </fieldset>

        <div class="form-group span-all">
          <label for="message">Message</label>
          <textarea
            name="message"
            id="message"
            required
            aria-required="true"
          ></textarea>
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group span-all">
          <input
            type="checkbox"
            data-error="To submit this form, please consent to being contacted"
            name="consent"
            id="consent"
            required
          />
          <label for="consent">I consent to being contacted by the team</label>
          <span class="error-message" aria-live="polite"></span>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="span-all button white-text-color"
        >
          Submit
        </button>
      </form>
    </main>

    <div class="modal-container">
      <div class="modal">
        <div>
          <img src="./assets/images/icon-success-check.svg" alt="" />
          <p>Message Sent!</p>
        </div>

        <p>Thanks for completing the form. We'll be in touch soon!</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
