<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <main class="main-wrapper">
      <h1>Contact Us</h1>
      <form action="" method="get" novalidate>
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input
            type="text"
            name="first-name"
            id="first-name"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input
            type="text"
            name="last-name"
            id="last-name"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="form-group span-all">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required />
        </div>

        <fieldset class="span-all">
          <legend>Query Type</legend>
          <div class="form-group">
            <input
              type="radio"
              name="query"
              id="gen-inquiry"
              value="General Enquiry"
              required
            />
            <label for="gen-inquiry">General Enquiry</label>
          </div>

          <div class="form-group">
            <input
              type="radio"
              name="query"
              id="supp-req"
              value="Support Request"
              required
            />
            <label for="supp-req">Support Request</label>
          </div>
        </fieldset>

        <div class="form-group span-all">
          <label for="message">Message</label>
          <textarea
            name="message"
            id="message"
            required
            aria-required="true"
            rows="5"
          >
          </textarea>
        </div>

        <div class="form-group span-all">
          <input type="checkbox" name="consent" id="consent" required />
          <label for="consent">I consent to being contacted by the team</label>
        </div>

        <button id="submit-btn" class="span-all button">Submit</button>
      </form>
    </main>

    <!--
    Submit Message Sent! Thanks for completing the form. We'll be in touch soon!-->
  </body>
</html>
