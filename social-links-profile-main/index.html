<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
        color: white;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Outfit", sans-serif;
      }

      body {
        background-color: hsl(0, 0%, 8%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }

      @font-face {
        font-family: "Outfit";
        src: url("./assets/fonts/Outfit-VariableFont_wght.ttf");
      }

      .container {
        background-color: hsl(0, 0%, 12%);
        width: 280px;
        height: fit-content;
        display: space-around;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 30px;
      }

      .profile-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin-bottom: 1rem;
        height: auto;
      }

      img {
        border-radius: 50%;
        width: 70px;
        height: auto;
        object-fit: cover;
        margin-bottom: 1rem;
      }

      .button-containers {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 12px;
      }

      button {
        background-color: hsl(0, 0%, 20%);
        color: hsl(0, 0%, 100%);
        border: none;
        padding: 10px 50px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: hsl(75, 94%, 57%);
      }

      .txt-location {
        color: hsl(75, 94%, 57%);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      h3 {
        color: hsl(0, 0%, 100%);
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 5px;
      }

      .txt-bio {
        color: rgb(176, 176, 176);
        font-size: 12px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile-container">
        <img src="./assets/images/avatar-jessica.jpeg" alt="profile picture" />
        <h3>Jessica Randall</h3>
        <p class="txt-location">London, United Kingdom</p>
        <p class="txt-bio">"Front-end developer and avid reader."</p>
      </div>

      <div class="button-containers">
        <button>Github</button>
        <button>Frontend Mentor</button>
        <button>LinkedIn</button>
        <button>Twitter</button>
        <button>Instagram</button>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
