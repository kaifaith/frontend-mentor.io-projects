<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Expenses chart component</title>
  </head>
  <body>
    <main>
      <div class="balance-wrapper">
        <div>
          <h1>My balance</h1>
          <p>$921.48</p>
        </div>

        <img src="images/logo.svg" alt="Logo" />
      </div>

      <div class="main-chart-wrapper">
        <h2>Spending - Last 7 days</h2>

        <div class="bar-wrapper">
          <div class="day">
            <div class="bar"></div>
            mon
          </div>

          <div class="day">
            <div class="bar"></div>
            tue
          </div>

          <div class="day">
            <div class="bar"></div>
            wed
          </div>

          <div class="day">
            <div class="bar"></div>
            thu
          </div>

          <div class="day">
            <div class="bar"></div>
            fri
          </div>

          <div class="day">
            <div class="bar"></div>
            sat
          </div>

          <div class="day">
            <div class="bar"></div>
            sun
          </div>
        </div>

        <div>
          <div>
            <p>Total this month</p>
            <p class="total-price">$478.33</p>
          </div>

          <div>
            <p class="plus-percent">+2.4%</p>
            <p>from last month</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
