<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./dist/style.css" />
    <title>Frontend Mentor | Age calculator app</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <form>
      <div class="input-wrapper">
        <div>
          <div class="input">
            <label for="day" class="poppins-bold">DAY</label>
            <input
              type="text"
              inputmode="numeric"
              name="day"
              id="day"
              placeholder="DD"
            />
          </div>

          <div class="input">
            <label for="month" class="poppins-bold">MONTH</label>
            <input
              type="text"
              inputmode="numeric"
              name="month"
              id="month"
              placeholder="MM"
            />
          </div>

          <div class="input">
            <label for="year" class="poppins-bold">YEAR</label>
            <input
              type="text"
              inputmode="numeric"
              name="year"
              id="year"
              placeholder="YYYY"
            />
          </div>
        </div>

        <button type="submit">
          <img
            src="assets/images/icon-arrow.svg"
            alt="Button icon"
            width="46"
            height="44"
          />
        </button>
      </div>

      <div class="result-container">
        <p class="poppins-extrabold-italic">
          <span id="year-result">--</span> years
        </p>
        <p class="poppins-extrabold-italic">
          <span id="month-result">--</span> months
        </p>
        <p class="poppins-extrabold-italic">
          <span id="days-result">--</span> days
        </p>
      </div>
    </form>
  </body>
</html>
