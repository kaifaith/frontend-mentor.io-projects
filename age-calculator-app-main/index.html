<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dist/style.css" />
    <title>Frontend Mentor | Age calculator app</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <form>
      <div class="input-wrapper">
        <div class="input">
          <label for="day" class="poppins-bold">DAY</label>
          <input
            type="text"
            inputmode="numeric"
            name="day"
            id="day"
            placeholder="DD"
          />
        </div>

        <div class="input">
          <label for="month" class="poppins-bold">MONTH</label>
          <input
            type="text"
            inputmode="numeric"
            name="month"
            id="month"
            placeholder="MM"
          />
        </div>

        <div class="input">
          <label for="year" class="poppins-bold">YEAR</label>
          <input
            type="text"
            inputmode="numeric"
            name="year"
            id="year"
            placeholder="YYYY"
          />
        </div>

        <button type="submit">
          <img
            src="assets/images/icon-arrow.svg"
            alt="Button icon"
            width="46"
            height="44"
          />
        </button>
      </div>

      <div class="result-container">
        <p class="poppins-extrabold-italic"><span>--</span> years</p>
        <p class="poppins-extrabold-italic"><span>--</span> months</p>
        <p class="poppins-extrabold-italic"><span>--</span> days</p>
      </div>
    </form>
  </body>
</html>
